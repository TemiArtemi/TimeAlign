<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeAlign - Ordena la Historia</title>
  <meta name="description" content="Juego diario: ordena 4 eventos históricos cronológicamente. ¿Puedes ordenar la historia?">
  <meta property="og:title" content="TimeAlign - Ordena la Historia">
  <meta property="og:description" content="Juego diario: ordena 4 eventos históricos cronológicamente.">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>">

  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="bg-pattern"></div>

  <main class="main">
    <header class="header">
      <div class="logo">⏳</div>
      <h1 class="title font-display">TimeAlign</h1>
      <p class="subtitle">Ordena los 4 eventos históricos: arriba = más antiguo</p>
    </header>

    <section class="game-area">
      <!-- Attempts indicator -->
      <div class="attempts" id="attempts"></div>

      <!-- Draggable events (vertical list) -->
      <div class="events-list" id="events-grid">
        <div style="text-align:center;padding:2rem;color:var(--muted);">
          Cargando puzzle...
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="check-btn" class="btn btn-primary" disabled>Comprobar</button>
        <button id="new-game-btn" class="btn btn-secondary">Nueva partida</button>
      </div>
    </section>
  </main>

  <!-- Result Modal -->
  <div id="result-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h2 id="modal-title">Resultado</h2>
      <p id="modal-message"></p>
      <div id="facts-list"></div>
      <p style="font-size:0.8rem;color:var(--muted);">
        Puzzle: <span id="puzzle-id" style="color:var(--accent);"></span>
      </p>
      <button id="share-btn" class="share-btn">Compartir resultado</button>
      <textarea id="share-text" readonly></textarea>
      <button id="close-modal" class="btn btn-secondary" style="margin-top:1rem;">Cerrar</button>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
